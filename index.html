<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#091321" />
  <meta name="description" content="A simple React CDN playground with small presentation panels for frontend experiments." />
  <meta property="og:title" content="React CDN App | Ashish Ranjan" />
  <meta property="og:description" content="A simple React CDN playground with small presentation panels for frontend experiments." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://a2rp.github.io/react_cdnapp/" />
  <meta property="og:image" content="https://a2rp.github.iopreview.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="public/favicon.ico" />
  <title>React CDN App | Ashish Ranjan</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --ink: #edf5ff;
      --muted: #91a5bc;
      --line: #263a52;
      --panel: #0e1c2e;
      --panel-strong: #142943;
      --accent: #66c7ff;
      --accent-dark: #123e5d;
      --bg: #07111f;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; min-width: 320px; }
    button, a { font: inherit; }
    button:focus-visible, a:focus-visible { outline: 3px solid rgba(102,199,255,.4); outline-offset: 3px; }
    .app { min-height: 100vh; }
    .site-header { align-items: center; background: rgba(7,17,31,.96); border-bottom: 1px solid var(--line); display: flex; height: 76px; justify-content: space-between; left: 0; padding: 0 5vw; position: fixed; right: 0; top: 0; z-index: 20; }
    .brand { align-items: center; color: var(--ink); display: inline-flex; gap: 12px; text-decoration: none; }
    .brand img { background: white; border-radius: 10px; height: 42px; object-fit: contain; padding: 3px; width: 42px; }
    .brand span { display: grid; gap: 2px; }
    .brand small { color: #7192b0; font-size: .62rem; font-weight: 800; letter-spacing: .13em; }
    .brand strong { font-size: .98rem; }
    .menu-button { background: transparent; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); cursor: pointer; display: none; font-size: 1.2rem; padding: 7px 10px; }
    .header-link { align-items: center; border: 1px solid var(--line); border-radius: 9px; color: var(--muted); display: inline-flex; gap: 8px; padding: 9px 13px; text-decoration: none; transition: border-color 180ms ease, box-shadow 180ms ease, color 180ms ease; }
    .header-link:hover, .header-link:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(102,199,255,.12); color: var(--accent); }
    .page-shell { margin: 0 auto; max-width: 1320px; padding: 115px 5vw 40px; }
    .layout { display: grid; gap: 18px; grid-template-columns: 220px minmax(0,1fr); min-height: calc(100vh - 190px); }
    .sidebar { background: rgba(14,28,46,.78); border: 1px solid var(--line); border-radius: 18px; padding: 15px; position: sticky; top: 96px; height: fit-content; }
    .sidebar-title { color: #7794b0; font-size: .7rem; font-weight: 800; letter-spacing: .14em; margin: 4px 10px 13px; text-transform: uppercase; }
    .nav-list { display: grid; gap: 6px; list-style: none; margin: 0; padding: 0; }
    .nav-list button { align-items: center; background: transparent; border: 1px solid transparent; border-radius: 10px; color: var(--muted); cursor: pointer; display: flex; gap: 11px; padding: 12px 11px; text-align: left; transition: border-color 180ms ease, box-shadow 180ms ease, color 180ms ease; width: 100%; }
    .nav-list button:hover, .nav-list button:focus-visible { border-color: #315171; box-shadow: 0 6px 18px rgba(0,0,0,.18); color: var(--ink); }
    .nav-list button.active { background: var(--panel-strong); border-color: var(--accent); color: var(--ink); }
    .nav-symbol { color: var(--accent); display: inline-flex; font-size: 1rem; justify-content: center; width: 20px; }
    .content-panel { background: linear-gradient(135deg, rgba(14,28,46,.94), rgba(8,19,33,.94)); border: 1px solid var(--line); border-radius: 18px; min-height: 540px; overflow: hidden; padding: 32px; }
    .content-header { align-items: start; display: flex; gap: 18px; justify-content: space-between; }
    .eyebrow { color: var(--accent); font-size: .7rem; font-weight: 800; letter-spacing: .15em; margin: 0 0 12px; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: clamp(2.4rem, 5vw, 4.8rem); letter-spacing: -.055em; line-height: 1.02; margin-bottom: 18px; max-width: 760px; }
    .lead { color: #bed0e1; font-size: 1.05rem; line-height: 1.8; max-width: 720px; }
    .content-image { border-radius: 15px; height: 190px; margin-top: 28px; object-fit: cover; width: 100%; }
    .info-grid { display: grid; gap: 13px; grid-template-columns: repeat(3,1fr); margin-top: 26px; }
    .info-card { background: rgba(20,41,67,.7); border: 1px solid #2d4866; border-radius: 13px; padding: 18px; transition: border-color 180ms ease, box-shadow 180ms ease; }
    .info-card:hover { border-color: var(--accent); box-shadow: 0 12px 25px rgba(0,0,0,.2); }
    .info-card strong { display: block; font-size: .95rem; margin-bottom: 7px; }
    .info-card span { color: var(--muted); font-size: .88rem; line-height: 1.6; }
    .time-card { background: var(--panel-strong); border: 1px solid #3b6082; border-radius: 16px; margin-top: 26px; padding: 26px; }
    .time-card strong { display: block; font-family: Consolas, monospace; font-size: clamp(2rem,5vw,4rem); letter-spacing: -.04em; }
    .time-card span { color: var(--muted); display: block; margin-top: 8px; }
    .site-footer { align-items: center; border-top: 1px solid var(--line); color: var(--muted); display: flex; gap: 20px; justify-content: space-between; padding: 24px 5vw; }
    .site-footer a { color: var(--ink); font-weight: 800; text-decoration: none; }
    .footer-links { display: flex; gap: 8px; }
    .footer-links a { align-items: center; border: 1px solid var(--line); border-radius: 8px; display: inline-flex; font-size: .9rem; height: 32px; justify-content: center; transition: border-color 180ms ease, box-shadow 180ms ease, color 180ms ease; width: 32px; }
    .footer-links a:hover, .footer-links a:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(102,199,255,.12); color: var(--accent); }
    .go-top { align-items: center; background: var(--accent); border: 1px solid var(--accent); border-radius: 50%; bottom: 22px; color: #07111f; cursor: pointer; display: inline-flex; height: 42px; justify-content: center; position: fixed; right: 22px; width: 42px; z-index: 25; }
    .go-top:hover, .go-top:focus-visible { box-shadow: 0 8px 22px rgba(102,199,255,.3); }
    @media (max-width: 760px) {
      .site-header { padding: 0 16px; }
      .header-link { display: none; }
      .menu-button { display: inline-flex; }
      .layout { grid-template-columns: 1fr; }
      .sidebar { position: static; }
      .nav-list { display: flex; overflow-x: auto; padding-bottom: 2px; }
      .nav-list button { flex: 0 0 auto; width: auto; }
      .nav-list button span:last-child { white-space: nowrap; }
      .page-shell { padding-left: 16px; padding-right: 16px; }
      .content-panel { padding: 23px; }
      .info-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 500px) {
      .brand small { font-size: .56rem; }
      .brand strong { font-size: .86rem; }
      .content-header { display: block; }
      .content-image { height: 150px; }
      .site-footer { align-items: flex-start; flex-direction: column; padding-left: 16px; padding-right: 16px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useEffect, useState } = React;

    const pages = {
      about: {
        label: "About",
        symbol: "◉",
        eyebrow: "React CDN playground",
        title: "A small app with a clear path through the UI.",
        lead: "This presentation page keeps the original CDN-based React setup while giving each menu item a useful, readable panel.",
        cards: [
          ["Simple setup", "React, ReactDOM, and Babel load directly from a CDN."],
          ["Small screens", "The side menu becomes a horizontal navigation row on mobile."],
          ["Easy to extend", "Add another panel without changing the overall structure."]
        ]
      },
      datetime: {
        label: "Date Time",
        symbol: "◷",
        eyebrow: "Live browser value",
        title: "Current date and time.",
        lead: "This panel updates once per second using a small React state example."
      },
      calendar: {
        label: "Calendar",
        symbol: "▦",
        eyebrow: "Plan the next idea",
        title: "Calendar thinking starts with one clear date.",
        lead: "Use this panel as a starting point for a calendar component with events, filters, and reminders.",
        cards: [["Today", "Choose a date to focus on."], ["Next step", "Add month navigation and event data."], ["Practice", "Keep state close to the UI that owns it."]]
      },
      python: {
        label: "Python",
        symbol: "⌘",
        eyebrow: "Programming notes",
        title: "Keep language experiments separate and focused.",
        lead: "This space can grow into notes, examples, or small Python references while the surrounding React shell stays reusable."
      },
      ipl: {
        label: "IPL",
        symbol: "◎",
        eyebrow: "Data panel",
        title: "Turn a simple menu into a data view.",
        lead: "Use this panel for team summaries, match records, or a small table powered by local data.",
        cards: [["Teams", "Create a small list of teams and colors."], ["Matches", "Show a match with a clear status."], ["Stats", "Add a compact stats card when the data is ready."]]
      }
    };

    function DateTimePanel() {
      const [now, setNow] = useState(new Date());
      useEffect(() => {
        const timer = window.setInterval(() => setNow(new Date()), 1000);
        return () => window.clearInterval(timer);
      }, []);
      return (
        <div className="time-card">
          <strong>{now.toLocaleTimeString()}</strong>
          <span>{now.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" })}</span>
        </div>
      );
    }

    function App() {
      const [active, setActive] = useState("about");
      const [showTop, setShowTop] = useState(false);

      useEffect(() => {
        const handleScroll = () => setShowTop(window.scrollY > 280);
        window.addEventListener("scroll", handleScroll);
        return () => window.removeEventListener("scroll", handleScroll);
      }, []);

      const page = pages[active];

      return (
        <div className="app">
          <header className="site-header">
            <a className="brand" href="#top" aria-label="React CDN app home">
              <img src="public/logo.png" alt="Ashish Ranjan logo" />
              <span><small>REACT CDN PLAYGROUND</small><strong>React CDN App</strong></span>
            </a>
            <a className="header-link" href="https://react.dev/learn" target="_blank" rel="noopener noreferrer">React guide ↗</a>
          </header>

          <main className="page-shell" id="top">
            <div className="layout">
              <aside className="sidebar" aria-label="App sections">
                <p className="sidebar-title">Sections</p>
                <ul className="nav-list">
                  {Object.entries(pages).map(([key, item]) => (
                    <li key={key}>
                      <button className={active === key ? "active" : ""} type="button" onClick={() => setActive(key)} aria-current={active === key ? "page" : undefined}>
                        <span className="nav-symbol" aria-hidden="true">{item.symbol}</span><span>{item.label}</span>
                      </button>
                    </li>
                  ))}
                </ul>
              </aside>

              <section className="content-panel" aria-live="polite">
                <div className="content-header">
                  <div>
                    <p className="eyebrow">{page.eyebrow}</p>
                    <h1>{page.title}</h1>
                    <p className="lead">{page.lead}</p>
                  </div>
                </div>
                {active === "datetime" && <DateTimePanel />}
                {active !== "datetime" && <img className="content-image" src="public/preview.png" alt="React CDN app preview" />}
                {page.cards && <div className="info-grid">{page.cards.map(([title, text]) => <article className="info-card" key={title}><strong>{title}</strong><span>{text}</span></article>)}</div>}
              </section>
            </div>
          </main>

          <footer className="site-footer">
            <span>Copyright © {new Date().getFullYear()} <a href="https://www.ashishranjan.net/" target="_blank" rel="noopener noreferrer">Ashish Ranjan</a></span>
            <div className="footer-links" aria-label="Social and support links">
              <a href="https://www.ashishranjan.net/" target="_blank" rel="noopener noreferrer" aria-label="Portfolio" title="Portfolio">◎</a>
              <a href="https://github.com/a2rp" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub">●</a>
              <a href="https://codepen.io/ash1198" target="_blank" rel="noopener noreferrer" aria-label="CodePen" title="CodePen">⌘</a>
              <a href="https://www.linkedin.com/in/aashishranjan" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" title="LinkedIn">in</a>
              <a href="https://www.facebook.com/theash.ashish/" target="_blank" rel="noopener noreferrer" aria-label="Facebook" title="Facebook">f</a>
              <a href="https://www.youtube.com/@ashishranjan-ashz?sub_confirmation=1" target="_blank" rel="noopener noreferrer" aria-label="YouTube" title="YouTube">▶</a>
              <a href="https://a2rp-donation-page.netlify.app/" target="_blank" rel="noopener noreferrer" aria-label="Support" title="Support">♥</a>
              <a href="https://buymeacoffee.com/a2rp" target="_blank" rel="noopener noreferrer" aria-label="Buy Me a Coffee" title="Buy Me a Coffee">☕</a>
              <a href="https://www.patreon.com/a2rp" target="_blank" rel="noopener noreferrer" aria-label="Patreon" title="Patreon">P</a>
            </div>
          </footer>
          {showTop && <button className="go-top" type="button" onClick={() => window.scrollTo({ top: 0, behavior: "smooth" })} aria-label="Go to top" title="Go to top">↑</button>}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
